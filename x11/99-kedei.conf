# Render into the vc4 fbdev framebuffer that kedei-lcd mirrors to the LCD.
Section "ServerFlags"
    Option "AutoAddGPU" "false"
EndSection

Section "Device"
    Identifier "kedei"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
EndSection

Section "Screen"
    Identifier "kedei"
    Device "kedei"
EndSection
